[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-film-date-stamp"
version = "1.0.0"
description = "Simulates authentic film quartz date stamps with physical optical burn-in, multi-layer glow, and halation in ComfyUI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20.0",
    "Pillow>=9.0.0",
    "torch",
]
keywords = ["comfyui", "film", "date-stamp", "quartz-date", "burn-in", "halation", "photography", "vintage"]
authors = [
    { name = "treeturtlefall-arch" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Graphics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/treeturtlefall-arch/FilmDateStamp"
Repository = "https://github.com/treeturtlefall-arch/FilmDateStamp"
Issues = "https://github.com/treeturtlefall-arch/FilmDateStamp/issues"

[tool.comfy]
PublisherId = "treeturtlefall-arch"
DisplayName = "Film Date Stamp (Optical Burn-in)"
Icon = ""
Includes = [
    "fonts/*",
    "web/*",
    "workflows/*",
]
